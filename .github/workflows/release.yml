name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: Build and package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X main.version=${tag#v}" \
            -o dist/vibe-vpn ./cmd/vpn
          (cd dist && tar -czf "vibe-vpn-${tag}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" vibe-vpn)
          (cd dist && sha256sum "vibe-vpn-${tag}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
            > "vibe-vpn-${tag}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256")
          ls -la dist
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz*
          generate_release_notes: true
