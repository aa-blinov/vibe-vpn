# nginx `stream` (TCP passthrough) config to put the vibe-vpn TLS listener
# behind a real web edge on port 443.
#
# Why passthrough (and not HTTP proxy): the vibe-vpn TLS transport selects the
# tunnel by a magic sequence written *inside* the encrypted TLS stream, and it
# already answers browsers with a minimal HTTP response itself. A terminating
# reverse proxy (nginx http{} / Caddy) would see that magic as plain bytes and
# interfere. So we let nginx act as a dumb TCP forward: it owns the cert and
# the public 443, but the actual TLS termination and the tunnel logic happen
# in the vibe-vpn server on an internal port.
#
# This gives the public edge a normal HTTPS look (TLS 1.3, SNI = your real
# domain, ALPN http/1.1) while the tunnel protocol runs untouched underneath.
#
# Setup:
#   1. Place this file at /etc/nginx/conf.d/stream-vpn.conf
#   2. vibe-vpn server should listen on an internal port, e.g.:
#        tls:
#          listen: 127.0.0.1:1443
#      (the public 443 is now taken by nginx)
#   3. nginx -t && systemctl reload nginx
#
# NOTE: client certificate verification still uses the vibe-vpn server cert
# (server.crt), not nginx's. Generate server.crt for your real domain so the
# client's `tls.ca` matches the SNI it connects to.

stream {
    upstream vibe_vpn_backend {
        server 127.0.0.1:1443;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        proxy_pass vibe_vpn_backend;

        # A real certificate for the public domain. nginx terminates nothing —
        # it only needs a cert to look like a real HTTPS endpoint to probes.
        ssl_certificate     /etc/letsencrypt/live/vpn.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vpn.example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
    }
}
